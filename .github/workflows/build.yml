# What "done" means (CLAUDE.md), checked on GitHub on every push to main and every pull request (docs/adr/0013): the
# solution builds with no warnings, every test passes on PostgreSQL 18 (the version the app runs on), and the model has no
# change a migration is missing. Changes go straight to main, so this runs after the push: a run that fails is fixed first.
#
# The repository is public, so GitHub's runners cost nothing. The docs are checked too (DocPathsTests reads the paths they
# name), so only a push of .claude/ alone runs nothing. Every push to main gets a run of its own, never cancelled by the next,
# so each commit has its own answer; a newer push to a pull request cancels its run still going. The Actions tab starts one.
name: Build and test

on:
  push:
    branches: [main]
    paths-ignore: ['.claude/**']
  pull_request:
    paths-ignore: ['.claude/**']
  workflow_dispatch:

# A pull request's runs share a group, so its newer push cancels the older run; any other run has a group of its own (its
# commit's), since a group holds only one run waiting and a third push would cancel the second's.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    # Windows: the app is a WinUI window (the Maui project's target is net11.0-windows), and the backup tests check
    # the backups folder's Windows permissions.
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      # The PostgreSQL the developer's PC runs (EDB's Windows build).
      POSTGRES_VERSION: '18.7-1'

    # The actions on Node.js 24, the runtime GitHub runs JavaScript actions on: their Node.js 20 majors (v4) are deprecated.
    steps:
      - uses: actions/checkout@v7

      - name: .NET SDK (global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: NuGet package cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Its newest for the SDK, its manifests updated with it. Not with --skip-manifest-update, as the developer's PC installs
      # it (CLAUDE.md): beside the runner image's Visual Studio workloads that removed the MAUI manifest it had installed
      # from, so the build found no MAUI SDK and built the app as a plain project (2026-11-25). Listed, for the record.
      - name: MAUI workload
        run: |
          dotnet workload install maui-windows
          if ($LASTEXITCODE) { throw "The MAUI workload didn't install ($LASTEXITCODE)" }
          dotnet workload list

      - name: dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 11.0.0

      # A server of the job's own, set up as a developer's: the tinapayanrms role, which can create the test databases,
      # its password in pgpass.conf, and the tools in Program Files\PostgreSQL\18, where the backups look for pg_dump and
      # pg_restore, newest version first (the runner has an older PostgreSQL of its own there, its service off).
      - name: PostgreSQL 18
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'pgsql.zip'
          Invoke-WebRequest "https://get.enterprisedb.com/postgresql/postgresql-$env:POSTGRES_VERSION-windows-x64-binaries.zip" -OutFile $zip
          tar -xf $zip -C $env:RUNNER_TEMP
          if ($LASTEXITCODE) { throw "Couldn't unpack PostgreSQL ($LASTEXITCODE)" }
          $root = 'C:\Program Files\PostgreSQL\18'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          Move-Item (Join-Path $env:RUNNER_TEMP 'pgsql') $root
          $bin = Join-Path $root 'bin'

          $password = [Guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$password"
          $pwfile = Join-Path $env:RUNNER_TEMP 'pwfile'
          [IO.File]::WriteAllText($pwfile, $password)

          # UTF-8 and the developer's PC's locale, so names sort and compare as they do there.
          $data = Join-Path $env:RUNNER_TEMP 'pgdata'
          & "$bin\initdb.exe" -D $data -U postgres "--pwfile=$pwfile" --auth=scram-sha-256 --encoding=UTF8 --locale-provider=libc "--locale=English_United States.1252"
          if ($LASTEXITCODE) { throw "initdb failed ($LASTEXITCODE)" }
          & "$bin\pg_ctl.exe" -D $data -l (Join-Path $env:RUNNER_TEMP 'postgres.log') -w start
          if ($LASTEXITCODE) { throw "pg_ctl start failed ($LASTEXITCODE)" }

          $env:PGPASSWORD = $password
          & "$bin\psql.exe" -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE tinapayanrms LOGIN CREATEDB PASSWORD '$password'"
          if ($LASTEXITCODE) { throw "Couldn't create the tinapayanrms role ($LASTEXITCODE)" }

          $pgpass = Join-Path $env:APPDATA 'postgresql\pgpass.conf'
          New-Item -ItemType Directory -Force (Split-Path $pgpass) | Out-Null
          [IO.File]::WriteAllText($pgpass, "localhost:5432:*:tinapayanrms:$password`n")
          Remove-Item $pwfile
          & "$bin\postgres.exe" --version

      - name: Build
        # Warnings fail the build, as the developer's has none; NuGet's vulnerability audit only reports. Its binary log
        # is kept when it fails (below), as what the runner's build saw can differ from the developer's.
        run: dotnet build TinapayanRMS.slnx -warnaserror "-warnnotaserror:NU1900,NU1901,NU1902,NU1903,NU1904" "-bl:${{ runner.temp }}/build.binlog"

      # The failed build's binary log, a week, for the MSBuild Structured Log Viewer or `gh run download <id> -n build-binlog`.
      - name: The build's binary log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-binlog
          path: ${{ runner.temp }}/build.binlog
          if-no-files-found: ignore
          retention-days: 7

      # The runner's image sets PGUSER and PGPASSWORD for its own PostgreSQL. A password in the environment wins over
      # pgpass.conf, for Npgsql and pg_dump alike, and the backup test of a pg_dump with no password at all expects none.
      - name: Model changes without a migration
        run: |
          Remove-Item Env:PGPASSWORD, Env:PGUSER -ErrorAction Ignore
          dotnet ef migrations has-pending-model-changes --project src/TinapayanRMS.Infrastructure --no-build
          if ($LASTEXITCODE) { throw "The model has changes no migration has: dotnet ef migrations add <Name>" }

      - name: Tests
        run: |
          Remove-Item Env:PGPASSWORD, Env:PGUSER -ErrorAction Ignore
          dotnet test --solution TinapayanRMS.slnx --no-build
          if ($LASTEXITCODE) { throw "Tests failed ($LASTEXITCODE)" }

      - name: PostgreSQL's log
        if: failure()
        run: Get-Content (Join-Path $env:RUNNER_TEMP 'postgres.log') -Tail 200 -ErrorAction Ignore
