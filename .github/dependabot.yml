# Dependency updates as pull requests, each checked by the build workflow (.github/workflows/build.yml) before it's merged
# on its own (docs/adr/0013). Weekly and grouped, so a week's updates are a few pull requests to check rather than one per
# package. Packages that must move together are grouped together, as Directory.Packages.props says they must.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      syncfusion:
        patterns: ["Syncfusion.*"]
      # The first group a package matches takes it. The WebView pin without .Maui is the runtime's
      # (Directory.Packages.props), so it's left for dotnet-runtime below.
      maui:
        patterns: ["Microsoft.Maui.*", "Microsoft.AspNetCore.Components.WebView.Maui"]
      ef-core-and-npgsql:
        patterns: ["Microsoft.EntityFrameworkCore*", "Npgsql*", "EFCore.*"]
      dotnet-runtime:
        patterns: ["Microsoft.Extensions.*", "Microsoft.AspNetCore.*"]
      testing:
        patterns: ["TUnit*", "Microsoft.Testing.*", "AwesomeAssertions", "bunit", "CsCheck", "Respawn", "BenchmarkDotNet*"]
    ignore:
      # Held at 5.0.2, the last WiX under the plain MS-RL licence (Directory.Packages.props, the user's choice, 2026-11-15).
      - dependency-name: "WixToolset.*"
        versions: [">= 6.0.0"]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday

  # The build workflow's actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
